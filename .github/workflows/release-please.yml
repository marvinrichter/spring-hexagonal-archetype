name: Release Please

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Maven Central is published by hand, from a machine that holds the GPG
      # key and the central credentials. Nothing here uploads anything:
      #
      #     git checkout v<version>
      #     mvn --batch-mode -P release deploy -DskipTests
      #
      # The step that used to sit here ran `mvn deploy` without `-P release`,
      # so the central-publishing and gpg plugins in that profile never fired
      # and the default deploy failed for want of a distributionManagement
      # repository. It had been failing since the release before this note.
